<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Spendly</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand">📝</div>
    <h1>Create Account</h1>
    <p class="muted">Start tracking your expenses.</p>
    <form id="registerForm">
      <label>Full Name</label>
      <input id="registerName" type="text" placeholder="Your name" required>
      <label>Email</label>
      <input id="registerEmail" type="email" placeholder="you@example.com" required>
      <label>Password</label>
      <input id="registerPassword" type="password" minlength="4" placeholder="Create password" required>
      <button class="primary-btn" type="submit">Create Account</button>
    </form>
    <p class="auth-link">Already have an account? <a href="index.html">Login</a></p>
    <p id="registerMessage" class="message"></p>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
