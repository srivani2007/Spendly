<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics | Spendly</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="analytics">
  <div class="app-shell">
    <aside class="sidebar">
  <div class="brand-block"><span>💰</span><strong>ExpenseTrack</strong></div>
  <nav>
    <a href="dashboard.html" data-page="dashboard">🏠 <span>Dashboard</span></a>
    <a href="add-expense.html" data-page="add-expense">➕ <span>Add Expense</span></a>
    <a href="expenses.html" data-page="expenses">💳 <span>My Expenses</span></a>
    <a href="analytics.html" data-page="analytics">📊 <span>Analytics</span></a>
    <a href="budget.html" data-page="budget">🎯 <span>Budget</span></a>
    <a href="profile.html" data-page="profile">👤 <span>Profile</span></a>
  </nav>
  <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
</aside>
    <main class="main-content">
      <header class="topbar">
  <div>
    <h2 id="pageTitle">Spendly</h2>
    <p id="greeting" class="muted"></p>
  </div>
  <div class="user-chip">👤 <span id="topUserName">Student</span></div>
</header>
      <section class="page-content">
        
<div class="section-title"><span class="eyebrow">INSIGHTS</span><h1>Spending Analytics</h1><p class="muted">Understand your spending habits at a glance.</p></div>
<div class="stats-grid">
  <div class="stat-card"><span>Total Spent</span><strong id="analyticsTotal">₹0</strong></div>
  <div class="stat-card"><span>Average Expense</span><strong id="averageExpense">₹0</strong></div>
  <div class="stat-card"><span>Highest Expense</span><strong id="highestExpense">₹0</strong></div>
</div>
<div class="two-column">
  <div class="panel"><div class="panel-head"><h3>Category Breakdown</h3></div><div id="categoryChart"></div></div>
  <div class="panel"><div class="panel-head"><h3>Spending Insights</h3></div><div id="insights"></div></div>
</div>

      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
