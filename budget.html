<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget | Spendly</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="budget">
  <div class="app-shell">
    <aside class="sidebar">
  <div class="brand-block"><span>💰</span><strong>ExpenseTrack</strong></div>
  <nav>
    <a href="dashboard.html" data-page="dashboard">🏠 <span>Dashboard</span></a>
    <a href="add-expense.html" data-page="add-expense">➕ <span>Add Expense</span></a>
    <a href="expenses.html" data-page="expenses">💳 <span>My Expenses</span></a>
    <a href="analytics.html" data-page="analytics">📊 <span>Analytics</span></a>
    <a href="budget.html" data-page="budget">🎯 <span>Budget</span></a>
    <a href="profile.html" data-page="profile">👤 <span>Profile</span></a>
  </nav>
  <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
</aside>
    <main class="main-content">
      <header class="topbar">
  <div>
    <h2 id="pageTitle">Spendly</h2>
    <p id="greeting" class="muted"></p>
  </div>
  <div class="user-chip">👤 <span id="topUserName">Student</span></div>
</header>
      <section class="page-content">
        
<div class="section-title"><span class="eyebrow">BUDGET PLANNER</span><h1>Monthly Budget</h1><p class="muted">Set a spending limit and keep track of your progress.</p></div>
<div class="budget-card">
  <div class="budget-number" id="budgetValue">₹5,000</div>
  <p class="muted">Monthly budget</p>
  <div class="progress"><div id="budgetProgress" class="progress-fill"></div></div>
  <div class="budget-row"><span>Spent: <strong id="budgetSpent">₹0</strong></span><span>Remaining: <strong id="budgetRemaining">₹5,000</strong></span></div>
</div>
<div class="form-panel narrow">
  <label>Set Monthly Budget (₹)</label>
  <input id="budgetInput" type="number" min="1" placeholder="5000">
  <button id="saveBudget" class="primary-btn">Update Budget</button>
  <p id="budgetMessage" class="message"></p>
</div>

      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
  <script src="js/budget.js"></script>
</body>
</html>
