<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | Spendly</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="profile">
  <div class="app-shell">
    <aside class="sidebar">
  <div class="brand-block"><span>💰</span><strong>ExpenseTrack</strong></div>
  <nav>
    <a href="dashboard.html" data-page="dashboard">🏠 <span>Dashboard</span></a>
    <a href="add-expense.html" data-page="add-expense">➕ <span>Add Expense</span></a>
    <a href="expenses.html" data-page="expenses">💳 <span>My Expenses</span></a>
    <a href="analytics.html" data-page="analytics">📊 <span>Analytics</span></a>
    <a href="budget.html" data-page="budget">🎯 <span>Budget</span></a>
    <a href="profile.html" data-page="profile">👤 <span>Profile</span></a>
  </nav>
  <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
</aside>
    <main class="main-content">
      <header class="topbar">
  <div>
    <h2 id="pageTitle">Spendly</h2>
    <p id="greeting" class="muted"></p>
  </div>
  <div class="user-chip">👤 <span id="topUserName">Student</span></div>
</header>
      <section class="page-content">
        
<div class="section-title"><span class="eyebrow">ACCOUNT</span><h1>My Profile</h1><p class="muted">Manage your account details.</p></div>
<div class="profile-layout">
  <div class="profile-avatar">👤</div>
  <div class="form-panel">
    <form id="profileForm">
      <label>Full Name</label><input id="profileName" required>
      <label>Email</label><input id="profileEmail" type="email" required>
      <label>Preferred Currency</label><select id="currency"><option>INR (₹)</option><option>USD ($)</option><option>EUR (€)</option></select>
      <button class="primary-btn" type="submit">Save Changes</button>
      <p id="profileMessage" class="message"></p>
    </form>
  </div>
</div>

      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
