<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Expense | Spendly</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="add-expense">
  <div class="app-shell">
    <aside class="sidebar">
  <div class="brand-block"><span>💰</span><strong>ExpenseTrack</strong></div>
  <nav>
    <a href="dashboard.html" data-page="dashboard">🏠 <span>Dashboard</span></a>
    <a href="add-expense.html" data-page="add-expense">➕ <span>Add Expense</span></a>
    <a href="expenses.html" data-page="expenses">💳 <span>My Expenses</span></a>
    <a href="analytics.html" data-page="analytics">📊 <span>Analytics</span></a>
    <a href="budget.html" data-page="budget">🎯 <span>Budget</span></a>
    <a href="profile.html" data-page="profile">👤 <span>Profile</span></a>
  </nav>
  <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
</aside>
    <main class="main-content">
      <header class="topbar">
  <div>
    <h2 id="pageTitle">Spendly</h2>
    <p id="greeting" class="muted"></p>
  </div>
  <div class="user-chip">👤 <span id="topUserName">Student</span></div>
</header>
      <section class="page-content">
        
<div class="section-title"><span class="eyebrow">TRANSACTION</span><h1>Add New Expense</h1><p class="muted">Record where your money went.</p></div>
<div class="form-panel">
  <form id="expenseForm" class="grid-form">
    <div><label>Expense Name</label><input id="expenseName" type="text" placeholder="e.g. Lunch" required></div>
    <div><label>Amount (₹)</label><input id="amount" type="number" min="1" step="0.01" placeholder="e.g. 250" required></div>
    <div><label>Category</label><select id="category"><option>Food</option><option>Travel</option><option>Shopping</option><option>Education</option><option>Entertainment</option><option>Other</option></select></div>
    <div><label>Date</label><input id="expenseDate" type="date" required></div>
    <div class="full"><label>Description</label><textarea id="description" rows="4" placeholder="Optional note"></textarea></div>
    <div class="full form-actions"><button class="primary-btn" type="submit">Add Expense</button><a class="secondary-btn" href="expenses.html">Cancel</a></div>
  </form>
  <p id="expenseMessage" class="message"></p>
</div>

      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
  <script src="js/add-expense.js"></script>
</body>
</html>
