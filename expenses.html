<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Expenses | Spendly</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="expenses">
  <div class="app-shell">
    <aside class="sidebar">
  <div class="brand-block"><span>💰</span><strong>ExpenseTrack</strong></div>
  <nav>
    <a href="dashboard.html" data-page="dashboard">🏠 <span>Dashboard</span></a>
    <a href="add-expense.html" data-page="add-expense">➕ <span>Add Expense</span></a>
    <a href="expenses.html" data-page="expenses">💳 <span>My Expenses</span></a>
    <a href="analytics.html" data-page="analytics">📊 <span>Analytics</span></a>
    <a href="budget.html" data-page="budget">🎯 <span>Budget</span></a>
    <a href="profile.html" data-page="profile">👤 <span>Profile</span></a>
  </nav>
  <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
</aside>
    <main class="main-content">
      <header class="topbar">
  <div>
    <h2 id="pageTitle">Spendly</h2>
    <p id="greeting" class="muted"></p>
  </div>
  <div class="user-chip">👤 <span id="topUserName">Student</span></div>
</header>
      <section class="page-content">
        
<div class="section-title"><span class="eyebrow">TRANSACTIONS</span><h1>My Expenses</h1><p class="muted">Search, filter and manage your spending.</p></div>
<div class="toolbar">
  <input id="searchInput" type="search" placeholder="🔍 Search expenses...">
  <select id="filterCategory"><option value="All">All Categories</option><option>Food</option><option>Travel</option><option>Shopping</option><option>Education</option><option>Entertainment</option><option>Other</option></select>
  <select id="sortExpenses"><option value="newest">Newest First</option><option value="oldest">Oldest First</option><option value="high">Amount: High to Low</option><option value="low">Amount: Low to High</option></select>
</div>
<div class="panel"><div id="expenseTable"></div></div>

      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
  <script src="js/expenses.js"></script>
</body>
</html>
