<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spendly</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand">💰</div>
    <h1>Spendly</h1>
    <p class="muted">Manage your student spending in one place.</p>
    <form id="loginForm">
      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="Enter email" required>
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="Enter password" required>
      <button class="primary-btn" type="submit">Login</button>
    </form>
    <p class="auth-link">New user? <a href="register.html">Create an account</a></p>
    <p id="loginMessage" class="message"></p>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
